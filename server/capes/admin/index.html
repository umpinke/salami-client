<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#2b1d1a">
  <meta name="color-scheme" content="dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Salami Capes">
  <title>Salami Capes – Prüfung</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="stylesheet" href="app.css">
  <script src="app.js" defer></script>
</head>
<body>
  <header class="bar">
    <div class="brand">
      <img class="logo" src="icon-192.png" alt="" width="34" height="34">
      <span class="brand-text">Salami Capes <small>Prüfung</small></span>
    </div>
    <button type="button" class="ghost small install" id="install" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11m-5-5l5 5 5-5M5 20h14"/></svg> App
    </button>
    <div class="who" id="who" hidden>
      <button type="button" class="icon-btn" id="push" title="Push-Benachrichtigungen" aria-label="Push-Benachrichtigungen" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15zM10 20.5a2 2 0 0 0 4 0"/></svg>
      </button>
      <button type="button" class="icon-btn" id="refresh" title="Aktualisieren" aria-label="Aktualisieren">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.34-5.66M20 4v5h-5"/></svg>
      </button>
      <span class="admin-name" id="admin-name"></span>
      <button type="button" class="ghost small" id="logout">Abmelden</button>
    </div>
  </header>

  <main>
    <section class="login" id="login" hidden>
      <div class="login-logo"><img class="logo big" src="icon-512.png" alt="Salami Client" width="120" height="120"></div>
      <h1>Salami Capes</h1>
      <p>Eigene Capes sind für andere Spieler erst sichtbar, wenn ein Admin sie hier freigibt.</p>
      <form id="login-form">
        <label for="token">Admin-Schlüssel</label>
        <input id="token" type="password" autocomplete="current-password" required>
        <button type="submit" class="primary big">Anmelden</button>
        <p class="error" id="login-error" role="alert"></p>
      </form>
      <p class="install-hint" id="install-hint" hidden></p>
    </section>

    <section id="review" hidden>
      <nav class="tabs" role="tablist">
        <button type="button" role="tab" data-status="pending">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
          <span class="tab-label">Wartet</span> <span class="count" data-count="pending">0</span>
        </button>
        <button type="button" role="tab" data-status="approved">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
          <span class="tab-label">Freigegeben</span> <span class="count" data-count="approved">0</span>
        </button>
        <button type="button" role="tab" data-status="rejected">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
          <span class="tab-label">Abgelehnt</span> <span class="count" data-count="rejected">0</span>
        </button>
        <button type="button" role="tab" data-status="reported">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 21V4h11l-1.5 4L16 12H5"/></svg>
          <span class="tab-label">Gemeldet</span> <span class="count" data-count="reported">0</span>
        </button>
      </nav>
      <p class="hint" id="hint"></p>
      <p class="error" id="list-error" role="alert"></p>
      <div class="grid" id="grid"></div>
      <div class="empty" id="empty" hidden></div>
    </section>
  </main>

  <template id="card-template">
    <article class="card">
      <div class="stage">
        <div class="previews">
          <figure><canvas class="px" data-part="outside"></canvas><figcaption>Cape</figcaption></figure>
          <figure><canvas class="px" data-part="inside"></canvas><figcaption>Innen</figcaption></figure>
          <figure><canvas class="px" data-part="elytra"></canvas><figcaption>Elytra</figcaption></figure>
        </div>
        <details class="texture-box">
          <summary>Ganze Textur</summary>
          <canvas class="px texture" data-part="texture"></canvas>
        </details>
      </div>
      <dl class="meta">
        <dt>Von</dt><dd class="submitter"></dd>
        <dt>Eingereicht</dt><dd class="submitted"></dd>
        <dt>Trägt gerade</dt><dd class="users"></dd>
        <dt class="reviewed-label">Geprüft</dt><dd class="reviewed"></dd>
        <dt class="reason-label">Grund</dt><dd class="reason"></dd>
      </dl>
      <div class="reports" hidden>
        <p class="reports-title"></p>
        <ul></ul>
      </div>
      <div class="actions">
        <button type="button" class="primary approve">Freigeben</button>
        <button type="button" class="danger reject">Ablehnen</button>
      </div>
      <form class="reject-form" hidden>
        <input type="text" maxlength="200" placeholder="Grund (optional, sieht der Spieler)">
        <div class="actions">
          <button type="submit" class="danger">Ablehnen</button>
          <button type="button" class="ghost cancel">Abbrechen</button>
        </div>
      </form>
    </article>
  </template>
</body>
</html>
