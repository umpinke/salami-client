# Baut den Launcher für macOS (Apple Silicon + Intel) und Linux (AppImage + .deb).
#
# Windows baut weiter `launcher/scripts/release.mjs` lokal. Das Skript startet diesen Workflow
# für den Release-Commit, wartet auf ihn, lädt die Pakete herunter, signiert die Update-Dateien
# lokal (der Updater-Schlüssel bleibt auf dem Rechner) und veröffentlicht alles in einem Release.
#
# Hier wird nichts veröffentlicht und nichts signiert – die Pakete liegen nur als Artefakte am Lauf.
# Secret (optional): SALAMI_CURSEFORGE_API_KEY – ohne ihn ist CurseForge in diesen Builds aus.
name: Launcher macOS + Linux

run-name: ${{ inputs.label || format('Launcher macOS + Linux ({0})', github.ref_name) }}

on:
  workflow_dispatch:
    inputs:
      commit:
        description: "Commit, der gebaut wird (leer: Spitze des gewählten Branches)"
        required: false
        default: ""
      label:
        description: "Name des Laufs (release.mjs findet ihn darüber wieder)"
        required: false
        default: ""
  pull_request:
    paths:
      - ".github/workflows/launcher-mac-linux.yml"

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.suffix }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            target: aarch64-apple-darwin
            suffix: macOS-Apple-Silicon
          - runner: macos-latest
            target: x86_64-apple-darwin
            suffix: macOS-Intel
          # 22.04: ältere glibc, damit AppImage und .deb auch auf älteren Distributionen laufen
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            suffix: Linux
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
        working-directory: launcher
    env:
      OUT_DIR: ${{ github.workspace }}/release-out
    # Fremde Actions laufen mit Zugriff auf den Build (und das CurseForge-Secret): deshalb fest auf einen
    # Commit gepinnt statt auf ein verschiebbares Tag. Neue Version: Tag per
    # `gh api repos/<owner>/<repo>/commits/<tag> --jq .sha` auflösen und SHA + Kommentar hier ersetzen.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.commit || github.sha }}

      - name: Linux-Pakete
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      # salami-core für Minecraft ab 26.1 kompiliert mit --release 25 (mod/build.gradle.kts)
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 25
          cache: gradle
          cache-dependency-path: |
            mod/*.gradle*
            mod/gradle/wrapper/gradle-wrapper.properties

      # Fest auf 1.99.1: Ab Rust 1.100 legt Cargo die Build-Ordner anders an
      # (target/<ziel>/release/build/<paket>/<hash>/out). tauri-build 2.5.5 leitet daraus den falschen
      # Zielordner ab und scheitert unter macOS beim Kopieren von salami-capture
      # ("Operation not permitted"). Erst mit einem passenden tauri-build wieder auf stable stellen.
      # Der Commit stammt vom Zweig 1.99.1 der Action – dort steht die Version fest in action.yml.
      - uses: dtolnay/rust-toolchain@263313d2989f864a2b8613f97277288638e7d8f8 # 1.99.1
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: "launcher/src-tauri -> target"
          key: ${{ matrix.target }}

      - name: Frontend-Abhängigkeiten
        run: |
          npm install -g yarn@1.22.22
          yarn install --frozen-lockfile

      - name: Version
        run: echo "VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")" >> "$GITHUB_ENV"

      # Clip-Aufnahme salami-capture (externalBin in tauri.macos.conf.json) für das Ziel dieses Jobs.
      # beforeBuildCommand (tauri.release-local.json) baut sie auch, für Intel aber nur, wenn
      # TAURI_ENV_TARGET_TRIPLE ankommt – dann ist das hier ein Cache-Treffer.
      - name: Clip-Aufnahme für macOS
        if: runner.os == 'macOS'
        run: node scripts/stage-native-deps.mjs --target ${{ matrix.target }}

      # beforeBuildCommand baut außerdem salami-core für alle Minecraft-Versionen
      - name: Launcher bauen
        env:
          CURSEFORGE_KEY: ${{ secrets.SALAMI_CURSEFORGE_API_KEY }}
          # Linux: libayatana-appindicator fest verlinken, sonst fehlt sie im AppImage (Tray-Icon)
          RUSTFLAGS: ${{ runner.os == 'Linux' && '-C link-arg=-Wl,--no-as-needed -C link-arg=-layatana-appindicator3 -C link-arg=-Wl,--as-needed' || '' }}
        run: |
          # build.rs übernimmt die Variable ungekürzt – ein Zeilenumbruch im Secret machte den Key ungültig
          key="$(printf '%s' "$CURSEFORGE_KEY" | tr -d '[:space:]')"
          if [ -n "$key" ]; then
            export SALAMI_CURSEFORGE_API_KEY="$key"
          else
            echo "::warning::Secret SALAMI_CURSEFORGE_API_KEY fehlt – CurseForge ist in diesem Build aus."
          fi
          yarn tauri build --target ${{ matrix.target }} --config src-tauri/tauri.release-local.json

      - name: macOS-Pakete einsammeln
        if: runner.os == 'macOS'
        run: |
          bundle="src-tauri/target/${{ matrix.target }}/release/bundle"
          name="Salami-Client_${VERSION}_${{ matrix.suffix }}"
          mkdir -p "$OUT_DIR"
          cp "$bundle"/dmg/*.dmg "$OUT_DIR/$name.dmg"
          # Update-Datei wie Tauri sie baut: die .app als tar.gz (ohne macOS-Zusatzdateien ._*)
          COPYFILE_DISABLE=1 tar -czf "$OUT_DIR/$name.app.tar.gz" -C "$bundle/macos" "Salami Client.app"
          ls -la "$OUT_DIR"

      - name: Linux-Pakete einsammeln
        if: runner.os == 'Linux'
        run: |
          bundle="src-tauri/target/${{ matrix.target }}/release/bundle"
          name="Salami-Client_${VERSION}_${{ matrix.suffix }}"
          mkdir -p "$OUT_DIR"
          cp "$bundle"/deb/*.deb "$OUT_DIR/$name.deb"

          # Mitgelieferte Wayland-Bibliotheken passen nicht zu neueren Mesa-Treibern (leeres
          # Fenster/Absturz) – raus damit, dann nimmt das AppImage die des Systems.
          work="$RUNNER_TEMP/appimage"
          mkdir -p "$work"
          cp "$bundle"/appimage/*.AppImage "$work/app.AppImage"
          chmod +x "$work/app.AppImage"
          (cd "$work" && ./app.AppImage --appimage-extract > /dev/null)
          find "$work/squashfs-root" -name "*wayland*" -print -delete
          curl -fsSL -o "$work/appimagetool" \
            https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          # Prüfsumme fest (GitHub-Digest des Release-Assets 1.9.1): ein ausgetauschtes Asset bricht den
          # Build ab, statt ungeprüft ausgeführt zu werden und ins AppImage zu bauen.
          echo "ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0  $work/appimagetool" | sha256sum -c -
          chmod +x "$work/appimagetool"
          ARCH=x86_64 APPIMAGE_EXTRACT_AND_RUN=1 "$work/appimagetool" --no-appstream \
            "$work/squashfs-root" "$OUT_DIR/$name.AppImage"
          ls -la "$OUT_DIR"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: launcher-${{ matrix.suffix }}
          path: ${{ env.OUT_DIR }}/*
          if-no-files-found: error
          retention-days: 7
